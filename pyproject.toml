[project]
name = "icloud-calendar-readonly"
version = "0.2.0"
description = "Calendar-only read-only iCloud MCP with an Apple HTTPS transport allowlist."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "eodozzy" }]
keywords = ["mcp", "icloud", "imap", "caldav", "model-context-protocol"]
dependencies = [
    "mcp==1.30.0",
    "caldav==3.4.0",
    "niquests==3.21.2",
    "keyring==25.7.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
test = ["pytest", "pytest-anyio"]

[project.scripts]
icloud-calendar-readonly = "icloud_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
